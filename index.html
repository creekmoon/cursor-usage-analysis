<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor 用量花费估算</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="dx-shell">
    <header class="dx-bar">
      <div class="dx-brand">
        <span class="dx-mark" aria-hidden="true"></span>
        <span data-i18n="app.title">Cursor 用量花费估算</span>
      </div>
      <div class="dx-time" id="viewPicker" hidden>
        <button type="button" data-preset="d7"></button>
        <button type="button" data-preset="d30"></button>
        <button type="button" data-preset="month"></button>
        <button type="button" data-preset="all"></button>
        <span class="dx-time-gap" aria-hidden="true"></span>
        <button type="button" class="dx-time-cal" id="viewCalBtn">
          <span id="viewRangeLabel"></span>
        </button>
      </div>
      <div class="dx-actions">
        <button type="button" class="dx-ghost" id="langBtn">EN</button>
        <button type="button" class="dx-btn" id="exportBtn" data-i18n="action.exportReport">导出图片报告</button>
        <button type="button" class="dx-btn is-ink" id="replaceBtn" data-i18n="action.replaceCsv">更换 CSV</button>
        <button type="button" class="dx-btn is-ink" id="backBtn" data-i18n="entry.back" hidden>返回分析</button>
      </div>
    </header>

    <p class="dx-error" id="errorBar" role="alert" hidden></p>

    <section class="dx-entry" id="entry">
      <div class="dx-entry-banner">
        <h1 data-i18n="app.subtitle">解析 usage-events CSV，按官方价表估算理论花费。</h1>
        <span data-i18n="export.footer.disclaimer">价表估算，非官方账单</span>
      </div>
      <div class="dx-entry-grid">
        <article class="dx-tile">
          <p class="dx-k" data-i18n="entry.kicker1">01 · 选区间导出</p>
          <h2 data-i18n="entry.title1">选好区间，直接从 Cursor 下载 CSV</h2>
          <p class="dx-muted" data-i18n="entry.sub1">下载链接已按你选的日期自动拼好 UTC 时间范围</p>
          <div class="dx-dl" id="downloadPicker">
            <div class="dx-dl-presets">
              <button type="button" data-preset="d7"></button>
              <button type="button" data-preset="d30"></button>
              <button type="button" data-preset="month"></button>
              <button type="button" data-preset="d90"></button>
            </div>
            <button type="button" class="dx-date" id="downloadCalBtn">
              <span id="downloadRangeLabel"></span>
              <em id="downloadDays"></em>
            </button>
          </div>
          <a class="dx-cta" id="downloadCsv" href="https://cursor.com/api/dashboard/export-usage-events-csv" target="_blank" rel="noopener noreferrer" data-i18n="entry.download">下载这段时间的 CSV</a>
          <a class="dx-help" href="https://cursor.com/dashboard/usage" target="_blank" rel="noopener noreferrer" data-i18n="entry.login">还没登录 Cursor？去官网用量页手动导出</a>
        </article>
        <article class="dx-tile">
          <p class="dx-k" data-i18n="entry.kicker2">02 · 拖入即算</p>
          <h2 data-i18n="entry.title2">把 CSV 拖进来，本地秒算</h2>
          <p class="dx-muted" data-i18n="entry.sub2">纯浏览器计算，文件不会离开你的电脑</p>
          <button type="button" class="dx-drop" id="dropZone">
            <b data-i18n="entry.drop">拖拽 usage-events.csv 到这里，或点击选择文件</b>
          </button>
          <input id="fileInput" type="file" accept=".csv,text/csv" hidden />
        </article>
      </div>
    </section>

    <section class="dx-bento" id="bento" hidden>
      <div class="dx-top">
        <article class="dx-tile" id="heroBlock"></article>
        <article class="dx-tile" id="poolsBlock"></article>
        <article class="dx-tile" id="anatomyBlock"></article>
      </div>
      <div class="dx-bottom">
        <article class="dx-tile dx-chart-tile">
          <div class="dx-chart-bar">
            <div id="chartHead"></div>
            <div class="dx-segs" data-export-hide="1">
              <div class="dx-seg">
                <button type="button" data-chart-mode="daily" data-i18n="bento.daily">按日</button>
                <button type="button" data-chart-mode="cumulative" data-i18n="bento.cumulative">累计</button>
              </div>
              <div class="dx-seg">
                <button type="button" data-metric="cost" data-i18n="bento.metric.cost">花费</button>
                <button type="button" data-metric="tokens" data-i18n="bento.metric.tokens">Token</button>
                <button type="button" data-metric="events" data-i18n="bento.metric.events">次数</button>
              </div>
            </div>
          </div>
          <div class="dx-chart-host" id="chartHost"></div>
          <div class="dx-legend" id="chartLegend">
            <span><i class="dx-dot is-fp"></i><span data-i18n="bento.fp">第一方池</span></span>
            <span><i class="dx-dot is-api"></i><span data-i18n="bento.api">API 池</span></span>
            <span class="dx-muted" data-i18n="bento.inspect">点击任意模型或日期柱查看明细</span>
          </div>
        </article>
        <article class="dx-tile dx-side" id="sideBlock"></article>
      </div>
    </section>
    <p class="dx-sr" id="todayMark" hidden></p>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
