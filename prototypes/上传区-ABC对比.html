<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上传区方案对比 · 原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            page: "#F4F6F8",
            surface: "#FFFFFF",
            muted: "#EEF1F4",
            primary: "#15202B",
            secondary: "#4A5568",
            subtle: "#8B95A5",
            border: "#D8DEE6",
            "border-strong": "#C1CAD6",
            accent: { DEFAULT: "#0F766E", hover: "#0D9488", soft: "rgba(15, 118, 110, 0.12)" }
          },
          boxShadow: { focus: "0 0 0 3px rgba(15, 118, 110, 0.18)" }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .policy-toggle .chevron {
      display: inline-block;
      font-size: 10px;
      transition: transform 160ms ease;
    }
    .policy-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    .policy-panel { display: none; }
    .policy-panel.is-open { display: block; }
    .upload.is-dragover {
      border-color: #0F766E;
      background: rgba(15, 118, 110, 0.12);
    }
    .tab.is-active {
      background: #fff;
      color: #15202B;
      box-shadow: 0 0 0 1px #C1CAD6;
    }
  </style>
</head>
<body class="min-h-screen bg-page text-sm leading-normal text-primary bg-gradient-to-b from-[#E8EEF2] from-0% via-page via-[180px] to-page">
  <div class="max-w-[1180px] mx-auto px-6 py-8 pb-16 max-sm:px-4">
    <p class="m-0 text-xs text-subtle">原型 · 非正式页面 · 不接真实下载</p>
    <h1 class="m-0 mt-1 text-2xl font-semibold tracking-tight">上传区 A / B / C 对比</h1>
    <p class="m-0 mt-2 text-secondary text-[13px] max-w-[720px]">
      同一套现网颜色。现状是现在线上的样子。A 只补拖入提示；B 再把「选择 CSV」降为次按钮；C 把取文件和放文件分成两段。可点折叠，可开「模拟拖入」看框的悬停态。
    </p>

    <div class="mt-5 flex flex-wrap items-center gap-3">
      <div class="segmented inline-flex p-0.5 bg-muted rounded border border-border" role="tablist">
        <button type="button" class="tab is-active h-8 px-3 border-0 rounded-sm bg-transparent text-secondary text-xs font-medium cursor-pointer" data-view="now">现状</button>
        <button type="button" class="tab h-8 px-3 border-0 rounded-sm bg-transparent text-secondary text-xs font-medium cursor-pointer" data-view="a">A 只补提示</button>
        <button type="button" class="tab h-8 px-3 border-0 rounded-sm bg-transparent text-secondary text-xs font-medium cursor-pointer" data-view="b">B 提示+主次</button>
        <button type="button" class="tab h-8 px-3 border-0 rounded-sm bg-transparent text-secondary text-xs font-medium cursor-pointer" data-view="c">C 分两段</button>
        <button type="button" class="tab h-8 px-3 border-0 rounded-sm bg-transparent text-secondary text-xs font-medium cursor-pointer" data-view="grid">并排</button>
      </div>
      <label class="inline-flex items-center gap-2 text-xs text-secondary cursor-pointer">
        <input type="checkbox" id="dragSim" class="accent-accent" /> 模拟拖入悬停
      </label>
    </div>

    <p id="viewNote" class="m-0 mt-3 text-xs text-secondary"></p>

    <div id="singleWrap" class="mt-4">
      <div class="mb-5">
        <h2 class="m-0 mb-1.5 text-2xl font-semibold leading-tight tracking-tight">Cursor 用量花费估算</h2>
        <p class="m-0 mb-1.5 text-secondary text-[13px]">解析 usage-events CSV，按官方价表估算理论花费（$/1M tokens）。</p>
        <span class="text-accent text-[13px] font-medium">计费说明 ▾</span>
      </div>
      <div id="singleSlot"></div>
    </div>

    <div id="gridWrap" class="mt-6 hidden grid gap-5 md:grid-cols-2">
      <figure class="m-0">
        <figcaption class="mb-2 text-xs font-medium text-secondary">现状 · 两个绿按钮叠放</figcaption>
        <div data-mount="now"></div>
      </figure>
      <figure class="m-0">
        <figcaption class="mb-2 text-xs font-medium text-secondary">A · 只补拖入提示</figcaption>
        <div data-mount="a"></div>
      </figure>
      <figure class="m-0">
        <figcaption class="mb-2 text-xs font-medium text-accent">B · 推荐 · 提示 + 选择 CSV 变次按钮</figcaption>
        <div data-mount="b"></div>
      </figure>
      <figure class="m-0">
        <figcaption class="mb-2 text-xs font-medium text-secondary">C · 取文件 / 放文件两段</figcaption>
        <div data-mount="c"></div>
      </figure>
    </div>
  </div>

  <template id="tpl-guide">
    <ol class="m-0 p-0 list-none flex flex-col gap-1.5 text-secondary text-[13px] leading-relaxed text-left">
      <li class="flex gap-2"><span class="text-subtle tabular-nums shrink-0">1.</span><span>打开 <span class="text-accent">cursor.com/dashboard/usage</span></span></li>
      <li class="flex gap-2"><span class="text-subtle tabular-nums shrink-0">2.</span><span>时间范围选择 <span class="font-medium text-primary">30d</span></span></li>
      <li class="flex gap-2"><span class="text-subtle tabular-nums shrink-0">3.</span><span>点击 <span class="font-medium text-primary">Export CSV</span>，再将文件拖入此处</span></li>
    </ol>
  </template>

  <script>
    const notes = {
      now: "现状：下载和选择 CSV 同样醒目，「拖入」只写在标题里，容易被两个绿按钮盖住。",
      a: "A：按钮层次不变，只在下方加一句「把 CSV 拖入此框」。挤还在，拖入能看见。",
      b: "B：下载保持唯一实心按钮；选择 CSV 改成描边；拖入写在标题。虚线框重新像放文件的地方。",
      c: "C：上段取文件（下载+未登录），下段放文件（拖入+选择 CSV）。顺序更清楚，框里分组更多。",
      grid: "并排看层次差。点各框里的「尚未登录？」可展开备用三步。"
    };

    const btnPrimary =
      "inline-flex items-center justify-center min-w-[112px] h-9 px-4 border-0 rounded bg-accent text-white font-medium no-underline cursor-pointer hover:bg-accent-hover";
    const btnGhost =
      "inline-flex items-center justify-center min-w-[112px] h-9 px-4 border border-border-strong rounded bg-surface text-primary font-medium cursor-pointer hover:bg-muted";
    const toggleCls =
      "policy-toggle inline-flex items-center gap-1 p-0 border-0 bg-transparent text-accent text-[13px] font-medium cursor-pointer hover:underline";

    function guideHtml() {
      return document.getElementById("tpl-guide").innerHTML;
    }

    function fallbackBlock() {
      return `
        <button type="button" class="${toggleCls}" data-guide-toggle aria-expanded="false">
          <span>尚未登录？点此去 Cursor 登录</span> <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div class="policy-panel mt-0 px-3.5 py-3 bg-muted rounded text-secondary text-xs leading-relaxed w-full max-w-[420px]" hidden>
          ${guideHtml()}
        </div>`;
    }

    function downloadBtn() {
      return `<span class="${btnPrimary}">下载近 30 天 CSV</span>`;
    }

    const builders = {
      now() {
        return `
          <section class="upload flex flex-col items-center justify-center gap-3 min-h-[148px] px-6 py-7 bg-surface border border-dashed border-border-strong rounded-xl">
            <p class="m-0 text-[15px] font-medium">拖入 usage-events CSV，或点击选择</p>
            ${downloadBtn()}
            ${fallbackBlock()}
            <button type="button" class="${btnPrimary}">选择 CSV</button>
          </section>`;
      },
      a() {
        return `
          <section class="upload flex flex-col items-center justify-center gap-3 min-h-[148px] px-6 py-7 bg-surface border border-dashed border-border-strong rounded-xl">
            <p class="m-0 text-[15px] font-medium">拖入 usage-events CSV，或点击选择</p>
            ${downloadBtn()}
            ${fallbackBlock()}
            <button type="button" class="${btnPrimary}">选择 CSV</button>
            <p class="m-0 text-[13px] text-secondary">下载完成后，把 CSV 拖入此框</p>
          </section>`;
      },
      b() {
        return `
          <section class="upload flex flex-col items-center justify-center gap-2.5 min-h-[168px] px-6 py-7 bg-surface border border-dashed border-border-strong rounded-xl">
            <p class="m-0 text-[15px] font-medium">把 CSV 拖入此框</p>
            <p class="m-0 text-[13px] text-secondary">下载完成后拖进来，或点选择 CSV</p>
            ${downloadBtn()}
            ${fallbackBlock()}
            <button type="button" class="${btnGhost}">选择 CSV</button>
          </section>`;
      },
      c() {
        return `
          <section class="upload flex flex-col gap-4 min-h-[168px] px-6 py-6 bg-surface border border-dashed border-border-strong rounded-xl">
            <div class="flex flex-col items-center gap-2.5">
              <p class="m-0 text-[11px] font-medium tracking-wide text-subtle uppercase">从 Cursor 取文件</p>
              ${downloadBtn()}
              ${fallbackBlock()}
            </div>
            <div class="h-px w-full bg-border"></div>
            <div class="flex flex-col items-center gap-2.5 rounded-lg px-4 py-4 bg-muted/60">
              <p class="m-0 text-[15px] font-medium">把 CSV 拖入此框</p>
              <p class="m-0 text-[13px] text-secondary">下载完成后拖进来，或点选择 CSV</p>
              <button type="button" class="${btnGhost}">选择 CSV</button>
            </div>
          </section>`;
      }
    };

    function wire(root) {
      root.querySelectorAll("[data-guide-toggle]").forEach((btn) => {
        const panel = btn.nextElementSibling;
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("aria-expanded") !== "true";
          btn.setAttribute("aria-expanded", next ? "true" : "false");
          panel.classList.toggle("is-open", next);
          if (next) panel.removeAttribute("hidden");
          else panel.setAttribute("hidden", "");
        });
      });
    }

    function applyDrag(on) {
      document.querySelectorAll(".upload").forEach((el) => el.classList.toggle("is-dragover", on));
    }

    function mountSingle(key) {
      const slot = document.getElementById("singleSlot");
      slot.innerHTML = builders[key]();
      wire(slot);
      applyDrag(document.getElementById("dragSim").checked);
    }

    function mountGrid() {
      document.querySelectorAll("[data-mount]").forEach((el) => {
        const key = el.getAttribute("data-mount");
        el.innerHTML = builders[key]();
        wire(el);
      });
      applyDrag(document.getElementById("dragSim").checked);
    }

    function setView(key) {
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("is-active", t.getAttribute("data-view") === key));
      document.getElementById("viewNote").textContent = notes[key];
      const grid = key === "grid";
      document.getElementById("singleWrap").classList.toggle("hidden", grid);
      document.getElementById("gridWrap").classList.toggle("hidden", !grid);
      if (grid) mountGrid();
      else mountSingle(key);
    }

    document.querySelectorAll(".tab").forEach((t) => {
      t.addEventListener("click", () => setView(t.getAttribute("data-view")));
    });
    document.getElementById("dragSim").addEventListener("change", (e) => applyDrag(e.target.checked));
    setView("now");
  </script>
</body>
</html>
